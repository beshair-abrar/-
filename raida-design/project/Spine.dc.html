<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>العمود الفقري للمراحل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" role="img" aria-label="{{aria}}" style="width:100%;font-family:'IBM Plex Sans Arabic',Tajawal,sans-serif;color:#16302C;display:flex;flex-direction:column;gap:6px">
  <sc-if value="{{compact}}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px">
      <span style="font-weight:700;color:#0B4F4A">{{curLabel}}</span>
      <span style="color:#4A615C;font-weight:600">المرحلة {{cur}} من 5</span>
    </div>
  </sc-if>
  <div style="display:flex;align-items:flex-start;width:100%">
    <sc-for list="{{nodes}}" as="n" hint-placeholder-count="5">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0">
        <div style="display:flex;align-items:center;width:100%;height:{{n.size}}px">
          <div style="flex:1;height:3px;background:{{n.inColor}}"></div>
          <div style="width:{{n.size}}px;height:{{n.size}}px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:{{n.fs}}px;background:{{n.fill}};border:{{n.border}};color:{{n.fg}}">
            <sc-if value="{{n.check}}" hint-placeholder-val="{{ false }}">
              <svg width="{{n.ic}}" height="{{n.ic}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            </sc-if>
            <sc-if value="{{n.showNum}}" hint-placeholder-val="{{ true }}">
              <span>{{n.n}}</span>
            </sc-if>
          </div>
          <div style="flex:1;height:3px;background:{{n.outColor}}"></div>
        </div>
        <sc-if value="{{n.showLabel}}" hint-placeholder-val="{{ true }}">
          <div style="text-align:center;line-height:1.35;padding:0 4px">
            <div style="font-size:14px;font-weight:{{n.fw}};color:{{n.lc}}">{{n.label}}</div>
            <sc-if value="{{n.here}}" hint-placeholder-val="{{ false }}">
              <div style="font-size:12px;font-weight:600;color:#0B4F4A;margin-top:2px">أنتِ هنا</div>
            </sc-if>
            <sc-if value="{{n.gold}}" hint-placeholder-val="{{ false }}">
              <div style="font-size:12px;font-weight:700;color:#6B4C0E;margin-top:2px">دخل موثّق</div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"int","default":3,"min":1,"max":5},"variant":{"editor":"enum","options":["full","compact"],"default":"full"},"achieved":{"editor":"enum","options":["no","yes"],"default":"no"},"$preview":{"width":900,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['الاكتشاف', 'النواة الأكاديمية', 'المسار التخصصي', 'الإطلاق', 'الدخل المستدام'];
    const cur = Math.min(5, Math.max(1, Number(this.props.current ?? 3) || 3));
    const achieved = String(this.props.achieved ?? 'no') === 'yes';
    const compact = (this.props.variant ?? 'full') === 'compact';
    const size = compact ? 24 : 36;
    const nodes = labels.map((label, i) => {
      const n = i + 1;
      const isGold = achieved && n === 5;
      const done = n < cur || isGold;
      const here = n === cur && !isGold;
      const fill = isGold ? '#C9962C' : done ? '#127A6E' : '#FFFFFF';
      const border = isGold ? '2px solid #C9962C' : done ? '2px solid #127A6E' : here ? '3px solid #0B4F4A' : '2px solid #BFCFC8';
      const fg = isGold ? '#16302C' : done ? '#FFFFFF' : here ? '#0B4F4A' : '#4A615C';
      return {
        n, label, here, gold: isGold,
        check: done, showNum: !done,
        size, fs: compact ? 12 : 15, ic: compact ? 13 : 18,
        fill, border, fg,
        inColor: n === 1 ? 'transparent' : (n <= cur ? '#127A6E' : '#D5E0DB'),
        outColor: n === 5 ? 'transparent' : (n < cur ? '#127A6E' : '#D5E0DB'),
        showLabel: !compact,
        fw: here || isGold ? 700 : 500,
        lc: here ? '#0B4F4A' : (n > cur ? '#4A615C' : '#16302C')
      };
    });
    return {
      nodes, compact, cur,
      curLabel: labels[cur - 1],
      aria: 'مراحل الرحلة: المرحلة ' + cur + ' من 5، ' + labels[cur - 1] + (achieved ? '، الدخل موثّق' : '')
    };
  }
}
</script>
</body>
</html>
